; =============================================================================
; Blackfire Crusade - Godot 4 引擎性能優化與顯示覆寫設定 (override.cfg)
; =============================================================================

[display]
; -----------------------------------------------------------------------------
; 1. 垂直同步 (VSync)
; -----------------------------------------------------------------------------
; 垂直同步 (vsync_mode): 0=關閉 (解鎖幀率限制), 1=開啟, 2=自適應 (Adaptive), 3=Mailbox (極低延遲)
window/vsync/vsync_mode=0

; -----------------------------------------------------------------------------
; 2. 視窗尺寸與單螢幕掛機設定 (已保留備用，目前維持註解狀態)
; // 備註：讓該專案可以單螢幕運行的最佳方法之一是「固定視窗大小 (例如 1280x720)」，
; // 這樣遊戲就能在單一尺寸中計算 避免不同螢幕尺寸的問題
; // 若需要啟用固定視窗尺寸，請移除下方的分號 (;) 註解即可套用：
; -----------------------------------------------------------------------------
; window/size/viewport_width=1280
; window/size/viewport_height=720
; window/size/window_width_override=1280
; window/size/window_height_override=720
; window/size/resizable=true
; window/size/mode=0
; window/size/borderless=false


[application]
; -----------------------------------------------------------------------------
; 3. 幀率 (FPS) 平抑控制
; -----------------------------------------------------------------------------
; 限制最大 FPS: 60=標準流暢, 30=掛機超省電降溫 (戰鬥 6x~12x 倍速下可有效消除卡頓與發熱)
run/max_fps=60


[rendering]
; -----------------------------------------------------------------------------
; 4. 關閉/降低特效與抗鋸齒負載 (消除高倍速戰鬥時的粒子/渲染卡頓)
; -----------------------------------------------------------------------------
; 關閉全螢幕抗鋸齒 (MSAA 設為 0，大幅減輕 GPU 顯存負擔)
anti_aliasing/quality/msaa_2d=0
anti_aliasing/quality/msaa_3d=0
anti_aliasing/quality/screen_space_aa=0
anti_aliasing/quality/use_debanding=false

; 降低 2D 燈光與陰影解析度 (提升多粒子/多技能爆發時的流暢度)
2d/sdf/scale=0
2d/shadow_atlas/size=256
lights_and_shadows/use_soft_shadows=false

; 關閉輝光 (Glow) 與後期渲染特效 (避免技能高頻閃爍與 GPU 著色負擔)
environment/glow_enabled=false
environment/ssao_enabled=false
environment/ssil_enabled=false
environment/sdfgi_enabled=false
